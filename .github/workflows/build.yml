name: Build & Run samples

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 2026-11-07 升级：原 CI **只 build 不跑** ✗
      #   而示例的价值在"能跑通" ✓ ⇒ 加真实运行 + 断言输出 ✓
      # 2026-11-07：示例现为 **多目标** `net8.0;net48` ✓
      #   · net48 是 WinForm 主力 ⇒ **必须编译验证** ✓（Linux 上可编译，只是不能 run ✓）
      #   · net8.0 用于**真实运行**（Linux 无 .NET Framework 运行时 ✗）
      - name: Build all samples (net8.0 + net48)
        run: dotnet build ZL.IotEngine.Samples.sln -c Release --nologo

      - name: Install simulator (PlcSimulator.Cli)
        run: |
          dotnet tool install -g PlcSimulator.Cli --version 2.2.14
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Prepare Linux license fingerprint
        run: |
          # ZL.License 2.3.0：若 /sys/class/dmi/id/product_uuid 存在但不可读，
          # MachineFingerprint 会抛 UnauthorizedAccessException（GitHub runner 上该文件是 root-only）。
          # 先尝试放开读权限；若 sysfs 不允许 chmod，则用空文件 bind 覆盖，
          # 让指纹回退到可读的 /etc/machine-id（不是绕过授权，只是让 Linux 容器能正常取指纹）。
          if [ -e /sys/class/dmi/id/product_uuid ] && [ ! -r /sys/class/dmi/id/product_uuid ]; then
            sudo chmod a+r /sys/class/dmi/id/product_uuid 2>/dev/null || true
          fi
          if [ -e /sys/class/dmi/id/product_uuid ] && [ ! -r /sys/class/dmi/id/product_uuid ]; then
            sudo mount --bind /dev/null /sys/class/dmi/id/product_uuid 2>/dev/null || true
          fi
          if [ -e /sys/class/dmi/id/product_uuid ] && [ ! -r /sys/class/dmi/id/product_uuid ]; then
            echo "::warning::product_uuid still unreadable; license fingerprint may fail"
          fi

      - name: Start S7 simulator (31002)
        run: |
          nohup plcsim --headless --auto-start --stay-alive \
            --protocols s7 --ports s7=31002 > /tmp/sim-s7.log 2>&1 &
          for i in $(seq 1 60); do
            grep -q HEADLESS_READY /tmp/sim-s7.log && break; sleep 1
          done
          grep -q HEADLESS_READY /tmp/sim-s7.log || { echo "::error::simulator not ready"; tail -20 /tmp/sim-s7.log; exit 1; }
          echo "✅ simulator ready"

      - name: Run QuickStart (must print SMOKE ok)
        run: |
          set -e
          out=$(dotnet run --project samples/QuickStart/QuickStart.csproj -f net8.0 -c Release --no-build)
          echo "$out"
          echo "$out" | grep -q "写入=读回" || { echo "::error::QuickStart did not verify write/read"; exit 1; }

      - name: Start OPC UA simulator (4899) and run OpcUaClient
        run: |
          set -e
          nohup plcsim --headless --auto-start --stay-alive             --protocols opcua --ports opcua=4899             --points-file samples/OpcUaClient/points.json > /tmp/sim-opcua.log 2>&1 &
          for i in $(seq 1 60); do
            grep -q HEADLESS_READY /tmp/sim-opcua.log && break; sleep 1
          done
          grep -q HEADLESS_READY /tmp/sim-opcua.log || { echo "::error::opcua simulator not ready"; tail -30 /tmp/sim-opcua.log; exit 1; }
          out=$(dotnet run --project samples/OpcUaClient/OpcUaClient.csproj -f net8.0 -c Release --no-build)
          echo "$out"
          echo "$out" | grep -q "OPC UA 读/写链路验证通过" || { echo "::error::OpcUaClient failed"; exit 1; }

      - name: Run StringIO (string write must read back)
        run: |
          set -e
          out=$(dotnet run --project samples/StringIO/StringIO.csproj -f net8.0 -c Release --no-build)
          echo "$out"
          echo "$out" | grep -q "字符串写入 = 回读" || { echo "::error::StringIO failed"; exit 1; }

      - name: Run ArrayIO (array write must read back)
        run: |
          set -e
          out=$(dotnet run --project samples/ArrayIO/ArrayIO.csproj -f net8.0 -c Release --no-build)
          echo "$out"
          echo "$out" | grep -q "数组写入 = 回读" || { echo "::error::ArrayIO failed"; exit 1; }

      - name: Run BatchRead (must merge into blocks)
        run: |
          set -e
          out=$(dotnet run --project samples/BatchRead/BatchRead.csproj -f net8.0 -c Release --no-build)
          echo "$out"
          echo "$out" | grep -q "个读取块" || { echo "::error::BatchRead produced no blocks"; exit 1; }

      - name: Run Events (must receive callbacks)
        run: |
          set -e
          out=$(dotnet run --project samples/Events/Events.csproj -f net8.0 -c Release --no-build -- --seconds 8)
          echo "$out"
          echo "$out" | grep -q "值变化回调" || { echo "::error::Events got no callbacks"; exit 1; }

      - name: Start Modbus simulator (31502)
        run: |
          nohup plcsim --headless --auto-start --stay-alive \
            --protocols modbus-tcp --ports modbus=31502 > /tmp/sim-mb.log 2>&1 &
          for i in $(seq 1 60); do
            grep -q HEADLESS_READY /tmp/sim-mb.log && break; sleep 1
          done
          grep -q HEADLESS_READY /tmp/sim-mb.log || { echo "::error::modbus simulator not ready"; exit 1; }

      - name: Run Modbus (write must read back)
        run: |
          set -e
          out=$(dotnet run --project samples/Modbus/Modbus.csproj -f net8.0 -c Release --no-build)
          echo "$out"
          echo "$out" | grep -q "接入正常" || { echo "::error::Modbus sample failed"; exit 1; }

      - name: Run OpcUaServer + OpcUaClient (S7 -> OPC UA)
        run: |
          set -e
          cd samples/OpcUaServer
          nohup dotnet bin/Release/net8.0/ZL.IotHub.Sample.OpcUaServer.dll > /tmp/opcua-server.log 2>&1 &
          echo $! > /tmp/opcua-server.pid
          cd ../..
          for i in $(seq 1 60); do
            curl -sf http://localhost:5080/health >/dev/null 2>&1 && break; sleep 1
          done
          curl -sf http://localhost:5080/health >/dev/null 2>&1 || { echo "::error::OpcUaServer not ready"; tail -60 /tmp/opcua-server.log; exit 1; }
          sleep 2
          out=$(dotnet run --project samples/OpcUaClient/OpcUaClient.csproj -f net8.0 -c Release --no-build -- --config samples/OpcUaClient/opcua-server.xml)
          echo "$out"
          echo "$out" | grep -q "OPC UA 读取链路验证通过" || { echo "::error::OpcUaServer OPC UA read failed"; tail -60 /tmp/opcua-server.log; exit 1; }
          kill $(cat /tmp/opcua-server.pid) 2>/dev/null || true

      - name: Run MultiDevice (3 up / 1 down, no cascade)
        run: |
          set -e
          for p in 31101 31102 31103; do
            nohup plcsim --headless --auto-start --stay-alive \
              --protocols s7 --ports s7=$p > /tmp/sim-$p.log 2>&1 &
          done
          for i in $(seq 1 90); do
            n=$(grep -l HEADLESS_READY /tmp/sim-311*.log 2>/dev/null | wc -l)
            [ "$n" -ge 3 ] && break; sleep 1
          done
          out=$(dotnet run --project samples/MultiDevice/MultiDevice.csproj -f net8.0 -c Release --no-build)
          echo "$out"
          echo "$out" | grep -q "启动成功 3 台" || { echo "::error::MultiDevice isolation broken"; exit 1; }

      - name: Run BadPointIsolation (good points must survive)
        run: |
          set -e
          out=$(dotnet run --project samples/BadPointIsolation/BadPointIsolation.csproj -f net8.0 -c Release --no-build)
          echo "$out"
          echo "$out" | grep -q "RUN" || { echo "::error::BadPointIsolation good points failed"; exit 1; }

      - name: Dump simulator logs on failure
        if: failure()
        run: tail -50 /tmp/sim-*.log /tmp/opcua-server.log 2>/dev/null || true
