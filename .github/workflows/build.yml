name: Build samples

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build all samples
        run: |
          set -e
          for proj in samples/*/*.csproj; do
            echo "::group::build $proj"
            dotnet build "$proj" -c Release --nologo
            echo "::endgroup::"
          done
